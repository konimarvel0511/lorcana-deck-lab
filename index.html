<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lorcana Deck Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!--app-->
<div class="page">
  <header class="masthead">
    <h1>Lorcana Deck Lab</h1>
    <p>デッキリストから、狙ったカードを引ける確率とインクの安定度を計算します。</p>
  </header>

  <main class="layout">
    <section class="deck" aria-labelledby="deck-h">
      <div class="deck-head">
        <h2 id="deck-h">デッキ</h2>
        <p id="deck-summary" class="deck-summary"></p>
      </div>
      <div id="deck-warnings"></div>

      <details class="paste" id="paste">
        <summary>デッキリストを貼り付けて読み込む</summary>
        <label for="deck-text" class="hint">1行に「枚数 カード名」。例: 4 Elsa - Spirit of Winter</label>
        <textarea id="deck-text" rows="8" spellcheck="false" placeholder="4 Elsa - Spirit of Winter&#10;4 Be Prepared&#10;3 ミッキーマウス"></textarea>
        <div class="row">
          <button type="button" class="btn primary" id="import-btn">読み込む</button>
          <button type="button" class="btn" id="sample-btn">サンプルに戻す</button>
        </div>
        <p id="import-status" class="status" role="status"></p>
      </details>

      <div class="table-wrap">
        <table class="cards">
          <thead>
            <tr><th scope="col">枚数</th><th scope="col">カード名</th><th scope="col">コスト</th><th scope="col">インク</th><th scope="col">色</th><th scope="col" aria-label="操作"></th></tr>
          </thead>
          <tbody id="deck-rows"></tbody>
        </table>
      </div>
      <div class="row">
        <button type="button" class="btn" id="add-btn">カードを追加</button>
        <button type="button" class="btn" id="autofill-btn">コストとインクを自動入力（英語名のみ・試験的）</button>
      </div>
      <p id="autofill-status" class="status" role="status"></p>
    </section>

    <div class="results">
      <div class="turn-order" role="group" aria-label="先攻か後攻か">
        <button type="button" id="order-play" aria-pressed="true">先攻</button>
        <button type="button" id="order-draw" aria-pressed="false">後攻</button>
        <span class="hint">先攻は1ターン目にドローしません。</span>
      </div>
      <section id="draw" aria-labelledby="draw-h"></section>
      <section id="ink" aria-labelledby="ink-h"></section>
      <section id="curve" aria-labelledby="curve-h"></section>
    </div>
  </main>

  <footer class="foot">
    <p>確率は、よく切った山札から引く前提の計算値です。カードの効果による追加ドローは含みません。</p>
    <p>非公式のファンメイドツールです。Disney および Ravensburger とは関係ありません。</p>
  </footer>
</div>
<div id="tip" class="tip" hidden></div>
<!--/app-->
<script type="module" src="src/main.js"></script>
</body>
</html>
